<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StudyJug</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/studyjug-48.png" alt=""><div><h1>StudyJug</h1><p>A little learning in every page.</p></div></header>
<main><form id="pack-form"><label for="pack-name">Create pack</label><div class="row"><input id="pack-name" placeholder="(e.g. Chinese 101 words)" maxlength="60" required><button>Add pack</button></div></form>
<p class="hint">Enable a pack to underline its words. Hover over or click an underlined word to see your definition.</p><section class="search-tools" aria-label="Library search"><h2 style="font-size:14px;margin:0 0 8px">Your vocabulary packs</h2><div class="library-search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input type="search" id="library-search" aria-label="Search packs or vocabulary" placeholder="Search packs or vocabulary"></div><p id="search-summary" class="hint" role="status"></p></section><section id="word-results" hidden aria-label="Matching words"></section><h2 id="pack-results-heading" hidden>Matching packs</h2><div id="packs"></div>
<details class="settings"><summary>Settings</summary><label for="search-scope" class="hint">Global search includes</label><select id="search-scope"><option value="both">Pack names and words</option><option value="packs">Pack names only</option><option value="words">Words only</option></select><label class="future"><input type="checkbox" disabled> Quiz mode <span>Coming later</span></label><label class="setting"><input id="show-phonetics" type="checkbox"> Show phonetics in definition</label></details><p id="status" role="status"></p><footer class="app-footer"><span>James Pfaff (@TristanofJugdral)</span><a href="https://github.com/TristanofJugdral/StudyJug/issues" target="_blank" rel="noopener noreferrer" aria-label="Report an issue or send feedback" title="Report an issue or send feedback"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4Z"/><path d="M12 7v4m0 2v1"/></svg><span>Feedback</span></a></footer></main><script src="popup.js"></script></body></html>tings</summary><label for="search-scope" class="hint">Global search includes</label><select id="search-scope"><option value="both">Pack names and words</option><option value="packs">Pack names only</option><option value="words">Words only</option></select><label class="future"><input type="checkbox" disabled> Quiz mode <span>Coming later</span></label><label class="setting"><input id="show-phonetics" type="checkbox"> Show phonetics in definition</label></details><p id="status" role="status"></p></main><script src="popup.js"></script></body></html>
