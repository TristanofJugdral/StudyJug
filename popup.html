<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StudyJug</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/studyjug-48.png" alt=""><div><h1>StudyJug</h1><p>A little learning in every page.</p></div></header>
<main><form id="pack-form"><label for="pack-name">Your language packs</label><div class="row"><input id="pack-name" placeholder="Chinese, Arabic, English…" maxlength="60" required><button>Add pack</button></div></form>
<p class="hint">Enable a pack to underline its words. Hover over or click an underlined word to see your definition.</p><section class="search-tools" aria-label="Library search"><label for="library-search">Search your library</label><input type="search" id="library-search" placeholder="Pack names, words, phonetics or definitions…"><p id="search-summary" class="hint" role="status"></p></section><section id="word-results" hidden aria-label="Matching words"></section><h2 id="pack-results-heading" hidden>Matching packs</h2><div id="packs"></div>
<details class="settings"><summary>Settings</summary><label for="search-scope" class="hint">Global search includes</label><select id="search-scope"><option value="both">Pack names and words</option><option value="packs">Pack names only</option><option value="words">Words only</option></select><label class="future"><input type="checkbox" disabled> Quiz mode <span>Coming later</span></label><label class="setting"><input id="show-phonetics" type="checkbox"> Show phonetics in definition</label></details><p id="status" role="status"></p></main><script src="popup.js"></script></body></html>
